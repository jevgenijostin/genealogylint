[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "genealogylint"
version = "0.1.0"
description = "Offline GEDCOM validator and relationship calculator"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
genealogylint = "genealogylint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
